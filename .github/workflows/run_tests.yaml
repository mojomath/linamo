name: Linamo Unit Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  testing-linamo:
    name: with ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "macos-latest"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh

      - name: Add path
        run: |
          echo "PIXI_HOME=$HOME/.pixi" >> $GITHUB_ENV
          echo "$HOME/.pixi/bin"  >> $GITHUB_PATH

      - name: Pixi install
        run: |
          pixi install

      # `linamo.decimo` needs the decimo package on the include path, and
      # `tests/decimo` and `examples/decimo_examples.mojo` do not compile
      # without it. With no conda build carrying `decimo.Numeric` yet, this
      # falls through to the commit pinned in the script and precompiles it
      # with this workspace's own `mojo`.
      - name: Provision decimo
        run: |
          pixi run decimo

      - name: Run tests
        run: |
          bash ./tests/test_all.sh

      - name: Run examples
        run: |
          bash ./examples/run_all.sh

      - name: Run pre-commit
        run: |
          pixi run pre-commit run --all-files
