[workspace]
authors = ["ZHU Yuhao (朱宇浩) <dr.yuhao.zhu@outlook.com>"]
channels = ["https://conda.modular.com/max", "https://repo.prefix.dev/modular-community", "conda-forge"]
name = "linamo"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# Make `decimo` available. Every task below depends on this: the matrix types
# name `decimo.Numeric`, so no part of Linamo compiles without it. Set
# DECIMO_PATH to build from a local checkout; see the header of the script for
# the other sources.
decimo = "bash ./tools/ensure_decimo.sh"

# Build the package into the test directory.
pack = { cmd = "pixi run mojo precompile -I temp -o tests/linamo.mojoc src/linamo", depends-on = [
    "decimo",
] }

# Run the test files (uses -I src to import directly, no package build needed)
test = { cmd = "bash ./tests/test_all.sh", depends-on = ["decimo"] }

# Run every example. They touch the public API only, so this is the smoke test
# that catches a break a user would hit before the test suite would.
examples = { cmd = "bash ./examples/run_all.sh", depends-on = ["decimo"] }

# format the code
format = "pixi run mojo format ./src && pixi run mojo format ./tests"

# Install the git pre-commit hook into .git/hooks (run once per clone)
hooks = "pixi run pre-commit install"

[dependencies]
mojo = ">=1.0.0, <1.1.0"
# Decimo supplies the `Numeric` and `Parsable` traits the matrix types are
# written against, plus the error kinds in `decimo.errors`. It is a hard
# dependency: no part of Linamo compiles without it. v0.14.0 is required
# rather than merely preferred: it drops the `Integer` alias and its
# `Parsable.from_string` takes a `StringSlice`, so the element types cannot
# conform against both 0.13 and 0.14. `tools/ensure_decimo.sh` finds the
# package here instead of falling back to a pinned git checkout.
decimo = ">=0.14.0, <0.15.0"
# `parallelize()` moved from the Mojo stdlib to the MAX package in Mojo 1.0.0.
# MAX 26.5.x is the release paired with Mojo 1.0.0.
max = ">=26.5.0, <26.6"
numpy = "*"

# Formatting / lint toolchain driven by .pre-commit-config.yaml. These live
# in the workspace env (not a global install) so a fresh clone gets the
# hooks working after `pixi install && pixi run hooks`.
pre-commit = "*"
ruff = "*"
